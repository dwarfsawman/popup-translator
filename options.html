<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenRouter Translator Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>OpenRouter Translator 設定</h1>
    <div class="option">
      <label for="apiKey">OpenRouter APIキー:</label>
      <input type="password" id="apiKey" placeholder="OpenRouter APIキーを入力">
    </div>
    <div class="info">
      <p>OpenRouter APIキーは <a href="https://openrouter.ai/keys" target="_blank">https://openrouter.ai/keys</a> で取得できます。</p>
    </div>
    <button id="saveButton">保存</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
