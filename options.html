<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenRouter Translator Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>OpenRouter Translator 設定</h1>
    <div class="option">
      <label for="apiKey">OpenRouter APIキー:</label>
      <input type="password" id="apiKey" placeholder="OpenRouter APIキーを入力">
    </div>
    <div class="option">
      <label for="model">モデル:</label>
      <select id="model">
        <option value="openai/gpt-5.6-luna">openai/gpt-5.6-luna</option>
        <option value="openai/gpt-5.2">openai/gpt-5.2</option>
        <option value="x-ai/grok-4.3">x-ai/grok-4.3</option>
        <option value="anthropic/claude-sonnet-4">anthropic/claude-sonnet-4</option>
        <option value="google/gemini-2.5-pro-preview">google/gemini-2.5-pro-preview</option>
      </select>
      <p id="currentModelDisplay" class="current-model"></p>
    </div>
    <div class="info">
      <p>OpenRouter APIキーは <a href="https://openrouter.ai/keys" target="_blank">https://openrouter.ai/keys</a> で取得できます。</p>
    </div>
    <button id="saveButton">保存</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
